<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D2E">
<meta name="description" content="قارئ القرآن الكريم بنص عثماني وترجمات وتلاوة صوتية، مع استوديو لتصميم صور الآيات بخلفيات ومؤثرات وتصديرها PNG/JPG.">
<title>قارئ القرآن · استوديو تصميم الآيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Reem+Kufi:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ========================= Design Tokens ========================= */
:root{
  --green:#0B3D2E; --green-deep:#082a20; --green-soft:#13513d;
  --gold:#C9A227; --gold-light:#E6C75A; --gold-deep:#a8851a;
  --ivory:#FAF7F0; --paper:#F3EFE3; --paper-2:#EAE3D2;
  --text:#211d18; --muted:#6b6358; --line:#e2dacb;
  --night:#0D1B1A; --night-2:#102522; --night-card:#16292565;
  --shadow:0 6px 24px rgba(11,61,46,.10), 0 2px 6px rgba(11,61,46,.06);
  --shadow-lg:0 18px 60px rgba(11,61,46,.18);
  --r:18px; --r-sm:12px; --r-lg:26px;
  --quran-font:'Amiri Quran','Scheherazade New','Noto Naskh Arabic',serif;
  --body-font:'Noto Naskh Arabic','Amiri',serif;
  --ui-font:'Cairo','Tajawal',system-ui,sans-serif;
  --head-font:'Reem Kufi','Cairo',sans-serif;
}
html[data-theme="dark"]{
  --green:#0e3326; --green-deep:#06181a; --green-soft:#0f4030;
  --gold:#d8b545; --gold-light:#f0d271;
  --ivory:#0f1d1b; --paper:#0c1916; --paper-2:#0f201c;
  --text:#e9e6dd; --muted:#9aa49d; --line:#24363165;
  --night:#06141a; --night-2:#08221d; --night-card:#0f2520;
  --shadow:0 6px 24px rgba(0,0,0,.40); --shadow-lg:0 18px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--ui-font);
  background:var(--paper);
  color:var(--text);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(201,162,39,.06), transparent 38%),
    radial-gradient(circle at 88% 92%, rgba(11,61,46,.07), transparent 42%);
}
img{max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.keeper{padding-bottom:120px}

/* ========================= Top bar ========================= */
.topbar{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--ivory) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand .mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--green),var(--green-soft));
  display:grid;place-items:center;color:var(--gold-light);
  box-shadow:var(--shadow);flex:0 0 auto;
}
.brand .mark svg{width:22px;height:22px}
.brand .txt{display:flex;flex-direction:column;line-height:1.1}
.brand .txt b{font-family:var(--head-font);font-size:1.02rem;font-weight:600;color:var(--green)}
.brand .txt small{font-size:.66rem;color:var(--muted);letter-spacing:.2px}
.nav{display:flex;gap:2px;margin-inline-start:6px;flex:1 1 auto}
.nav a{
  padding:8px 14px;border-radius:10px;font-weight:600;font-size:.92rem;
  color:var(--muted);transition:.18s;white-space:nowrap;
}
.nav a:hover{background:var(--paper-2);color:var(--text)}
.nav a.active{background:var(--green);color:var(--ivory)}
.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.iconbtn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:var(--paper-2);color:var(--text);transition:.18s;font-size:1rem;
}
.iconbtn:hover{background:var(--green);color:var(--ivory)}
.search-mini{position:relative}
.search-mini input{
  width:180px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--paper-2);padding:0 36px 0 12px;font-size:.9rem;color:var(--text);
  transition:.2s;
}
.search-mini input:focus{width:230px;border-color:var(--gold);outline:none;background:var(--ivory)}
.search-mini .ic{position:absolute;inset-inline-start:9px;top:9px;color:var(--muted)}
.menu-btn{display:none}

/* ========================= Buttons ========================= */
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  padding:10px 18px;border-radius:12px;font-weight:700;font-size:.92rem;
  transition:.18s;border:1px solid transparent;white-space:nowrap;
}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--green);color:var(--ivory);box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--green-deep);transform:translateY(-1px)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#231a05;box-shadow:var(--shadow)}
.btn-gold:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-ghost{background:var(--paper-2);color:var(--text);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--gold);color:var(--green)}
.btn-lg{padding:14px 26px;font-size:1rem}
.btn-sm{padding:6px 12px;font-size:.82rem;border-radius:9px}

/* ========================= Home hero ========================= */
.hero{
  position:relative;border-radius:var(--r-lg);overflow:hidden;
  padding:clamp(34px,7vw,64px) clamp(20px,5vw,52px);color:var(--ivory);
  background:
    radial-gradient(circle at 80% 20%, rgba(201,162,39,.25), transparent 50%),
    linear-gradient(135deg,#06241c 0%,#0B3D2E 45%,#13513d 100%);
  box-shadow:var(--shadow-lg);margin-top:22px;
}
.hero::before{
  content:"";position:absolute;inset:0;opacity:.10;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><path d='M40 4 48 32 76 40 48 48 40 76 32 48 4 40 32 32Z' fill='none' stroke='%23E6C75A' stroke-width='1'/></svg>");
  background-size:80px 80px;
}
.hero .badge{
  display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;
  background:rgba(201,162,39,.18);color:var(--gold-light);padding:6px 14px;border-radius:999px;
  border:1px solid rgba(201,162,39,.3);
}
.hero .verse{
  font-family:var(--quran-font);text-align:center;line-height:2.1;
  font-size:clamp(1.5rem,4.4vw,2.6rem);margin:18px 0 6px;text-shadow:0 2px 14px rgba(0,0,0,.4);
  direction:rtl;
}
.hero .ref{display:flex;justify-content:center;gap:10px;align-items:center;color:var(--gold-light);font-weight:600;font-size:.92rem}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.hero h1{font-family:var(--head-font);font-weight:700;font-size:clamp(1.4rem,3vw,2rem);text-align:center;margin:0 0 6px}

/* continue reading */
.continue{
  display:flex;align-items:center;gap:14px;background:var(--ivory);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 18px;margin-top:18px;box-shadow:var(--shadow);
}
.continue .ic{width:42px;height:42px;border-radius:11px;background:var(--paper-2);display:grid;place-items:center;color:var(--gold-deep);flex:0 0 auto}
.continue .t{flex:1}
.continue .t b{display:block;font-size:.95rem}
.continue .t small{color:var(--muted);font-size:.82rem}

/* section head */
.sec-head{display:flex;align-items:center;gap:12px;margin:34px 0 16px}
.sec-head h2{font-family:var(--head-font);font-size:clamp(1.15rem,2.4vw,1.5rem);margin:0;color:var(--green)}
.sec-head .ln{flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:2px}
.sec-head .more{font-size:.86rem;color:var(--muted);font-weight:600}

/* ========================= Surah grid ========================= */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters .grow{flex:1}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:7px 14px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);
  font-size:.84rem;font-weight:600;color:var(--muted);transition:.16s;
}
.chip.active,.chip:hover{background:var(--green);color:var(--ivory);border-color:var(--green)}
.field{position:relative}
.field select,.field input{
  width:100%;height:42px;border-radius:11px;border:1px solid var(--line);
  background:var(--ivory);padding:0 14px;font-size:.92rem;color:var(--text);
}
.field input{padding-inline-start:38px}
.field .ic{position:absolute;inset-inline-start:11px;top:11px;color:var(--muted)}

.grid-surah{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.scard{
  position:relative;background:var(--ivory);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 14px;transition:.18s;overflow:hidden;cursor:pointer;
}
.scard::after{
  content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,162,39,.16),transparent 70%);
}
.scard:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:var(--shadow-lg)}
.scard .num{
  position:absolute;inset-inline-start:12px;top:12px;width:30px;height:30px;border-radius:9px;
  background:var(--paper-2);display:grid;place-items:center;font-weight:700;font-size:.82rem;color:var(--green);
  font-family:var(--ui-font);
}
.scard .place{
  position:absolute;inset-inline-end:12px;top:12px;font-size:.66rem;font-weight:600;color:var(--gold-deep);
  background:rgba(201,162,39,.12);padding:2px 8px;border-radius:999px;
}
.scard .ar{font-family:var(--head-font);font-size:1.5rem;font-weight:600;color:var(--green);margin-top:30px;text-align:center}
.scard .en{font-size:.78rem;color:var(--muted);text-align:center;margin-top:2px}
.scard .meta{display:flex;justify-content:center;gap:10px;margin-top:10px;font-size:.72rem;color:var(--muted)}
.scard .meta b{color:var(--text)}

/* ========================= Reader ========================= */
.reader-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--ivory);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 14px;margin:18px 0;box-shadow:var(--shadow);position:sticky;top:70px;z-index:30;
}
.reader-bar .back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--green);font-size:.9rem}
.reader-bar .sep{width:1px;height:22px;background:var(--line)}
.reader-bar .title{font-family:var(--head-font);font-weight:600;color:var(--green);font-size:1rem}
.reader-bar .spacer{flex:1}
.range-go{display:flex;align-items:center;gap:6px}
.range-go input{width:64px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper-2);text-align:center;font-size:.86rem}
.range-go input[dir=ltr]{font-family:var(--ui-font)}

.surah-head{
  position:relative;text-align:center;border-radius:var(--r-lg);overflow:hidden;
  padding:36px 20px 30px;margin-top:8px;color:var(--ivory);
  background:
    radial-gradient(circle at 50% 0%, rgba(201,162,39,.22), transparent 55%),
    linear-gradient(160deg,#0B3D2E,#06241c);
  box-shadow:var(--shadow-lg);
}
.surah-head .frame{
  position:absolute;inset:10px;border:1px solid rgba(201,162,39,.4);border-radius:calc(var(--r-lg) - 10px);
  pointer-events:none;
}
.surah-head .frame::before,.surah-head .frame::after{
  content:"";position:absolute;width:46px;height:46px;border:2px solid var(--gold);border-radius:8px;opacity:.5;
}
.surah-head .frame::before{inset-block-start:-2px;inset-inline-end:-2px;border-inline-start-color:transparent;border-block-end-color:transparent}
.surah-head .frame::after{inset-block-end:-2px;inset-inline-start:-2px;border-inline-end-color:transparent;border-block-start-color:transparent}
.surah-head .ename{font-size:.82rem;letter-spacing:1px;color:var(--gold-light);text-transform:uppercase}
.surah-head .aname{font-family:var(--head-font);font-size:clamp(2rem,7vw,3.2rem);font-weight:700;color:var(--ivory);margin:4px 0}
.surah-head .info{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:#dcd6c4;font-size:.84rem;margin-top:8px}
.surah-head .info b{color:var(--gold-light)}
.surah-head .bism{
  font-family:var(--quran-font);font-size:clamp(1.3rem,3.4vw,2rem);margin-top:16px;color:var(--gold-light);
  text-shadow:0 1px 8px rgba(0,0,0,.35);
}

.verse-card{
  background:var(--ivory);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;margin-bottom:12px;box-shadow:var(--shadow);transition:.18s;
}
.verse-card:hover{border-color:var(--gold)}
.verse-card.playing{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,162,39,.4),var(--shadow-lg)}
.verse-row{display:flex;align-items:flex-start;gap:14px}
.verse-num{
  flex:0 0 auto;width:40px;height:40px;position:relative;display:grid;place-items:center;margin-top:4px;
}
.verse-num svg{width:40px;height:40px}
.verse-num span{position:absolute;font-size:.78rem;font-weight:700;color:var(--gold-deep)}
.verse-text{
  font-family:var(--quran-font);font-size:var(--vsize,1.7rem);line-height:2.2;color:var(--green-deep);
  text-align:justify;text-align-last:center;flex:1;word-spacing:.04em;
}
html[data-theme="dark"] .verse-text{color:var(--ivory)}
.verse-trans{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-family:var(--body-font);font-size:.98rem;color:var(--muted);line-height:1.9}
.verse-trans .lbl{display:inline-block;font-size:.72rem;font-weight:700;color:var(--gold-deep);background:rgba(201,162,39,.12);padding:2px 8px;border-radius:6px;margin-bottom:6px}
.verse-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.vbtn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;font-size:.8rem;font-weight:600;
  background:var(--paper-2);color:var(--muted);transition:.16s;
}
.vbtn:hover{background:var(--green);color:var(--ivory)}
.vbtn.gold:hover{background:var(--gold);color:#231a05}
.vbtn svg{width:15px;height:15px}

.settings-panel{
  background:var(--ivory);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:var(--shadow);
}
.settings-panel .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.settings-panel .row:last-child{margin-bottom:0}
.settings-panel label{font-size:.84rem;font-weight:600;color:var(--muted);min-width:90px}
.settings-panel select,.settings-panel input[type=range]{flex:1;min-width:140px}
.settings-panel select{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--paper-2);padding:0 12px;font-size:.9rem}
.size-out{font-weight:700;color:var(--green);min-width:50px;text-align:center}

/* ========================= Player ========================= */
.player{
  position:fixed;inset-inline:0;bottom:0;z-index:80;
  background:color-mix(in srgb,var(--ivory) 94%, transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(11,61,46,.10);
  transform:translateY(110%);transition:transform .3s ease;
}
.player.show{transform:translateY(0)}
.player .wrap{display:flex;align-items:center;gap:14px;padding:10px 18px;min-height:64px}
.player .info{flex:0 0 auto;min-width:0}
.player .info b{display:block;font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.player .info small{font-size:.76rem;color:var(--muted)}
.player .ctl{display:flex;align-items:center;gap:6px}
.pbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);color:var(--text);transition:.16s}
.pbtn:hover{background:var(--paper-2);color:var(--green)}
.pbtn.play{width:46px;height:46px;background:var(--green);color:var(--ivory)}
.pbtn.play:hover{background:var(--green-deep)}
.pbtn svg{width:18px;height:18px}
.player .progress{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}
.player .progress .bar{flex:1;height:6px;border-radius:999px;background:var(--paper-2);overflow:hidden;cursor:pointer}
.player .progress .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:999px;width:0%}
.player .time{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px;text-align:center}
.player .reciter{flex:0 0 auto}
.player .reciter select{height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper-2);padding:0 10px;font-size:.82rem;color:var(--text)}

/* ========================= Studio ========================= */
.studio{display:grid;grid-template-columns:280px 1fr 300px;gap:16px;margin-top:18px;align-items:start}
.studio .col{background:var(--ivory);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.studio .col-h{padding:12px 16px;font-family:var(--head-font);font-weight:600;color:var(--ivory);background:linear-gradient(135deg,var(--green),var(--green-soft));font-size:.95rem;display:flex;align-items:center;gap:8px}
.studio .col-b{padding:14px 16px}
.studio .center{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px}
.canvas-stage{
  position:relative;width:100%;max-width:520px;aspect-ratio:1/1;
  background:repeating-conic-gradient(#e7e1d2 0% 25%, #efe9da 0% 50%) 50%/22px 22px;
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:grid;place-items:center;
}
.canvas-stage canvas{max-width:100%;max-height:100%;display:block;border-radius:6px}
.canvas-stage .stage-note{position:absolute;bottom:8px;inset-inline-start:10px;font-size:.7rem;color:var(--muted);background:rgba(255,255,255,.7);padding:2px 8px;border-radius:6px}
.studio-export{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.form-g{margin-bottom:14px}
.form-g:last-child{margin-bottom:0}
.form-g>label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.form-g select,.form-g input[type=text],.form-g input[type=number]{
  width:100%;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--paper-2);padding:0 12px;font-size:.9rem;color:var(--text);
}
.form-g .two{display:flex;gap:8px}
.form-g .two>*{flex:1}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sw{aspect-ratio:1;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.14s}
.sw:hover{transform:scale(1.08)}
.sw.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--ivory),0 0 0 4px var(--gold)}
.grads{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.gd{aspect-ratio:1.3/1;border-radius:9px;cursor:pointer;border:2px solid transparent;transition:.14s;position:relative}
.gd:hover{transform:scale(1.05)}
.gd.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--ivory),0 0 0 4px var(--gold)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem;font-weight:600}
.toggle:last-child{border-bottom:none}
.switch{position:relative;width:40px;height:22px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);transition:.18s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--ivory);box-shadow:var(--shadow);transition:.18s}
.switch.on{background:var(--green);border-color:var(--green)}
.switch.on::after{inset-inline-start:20px;background:var(--gold-light)}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1;accent-color:var(--green)}
.range-row .v{font-size:.78rem;font-weight:700;color:var(--green);min-width:34px;text-align:center}
.tmpl{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.tagline-bar .tg{flex:1;min-width:160px;background:var(--ivory);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:10px;align-items:flex-start}

<script>
/* ============================================================
   قارئ القرآن + استوديو تصميم الآيات — تطبيق HTML واحد مستقل
   المصادر: QUL API (الفصول/الآيات/الترجمات) · islamic.network (الصوت)
   ============================================================ */
/* ============ Config & API client ============ */
const API = "https://qul.tarteel.ai/api/v1";
const AUDIO_CDN = "https://cdn.islamic.network/quran/audio";

// قراء يعملون على islamic.network CDN (تم التحقق)
const RECITERS = [
  {slug:"ar.alafasy", name:"مشاري العفاسي", bit:128},
  {slug:"ar.husary", name:"محمود خليل الحصري", bit:128},
  {slug:"ar.minshawi", name:"محمد صديق المنشاوي", bit:128},
  {slug:"ar.mahermuaiqly", name:"ماهر المعيقلي", bit:128},
  {slug:"ar.shaatree", name:"أبو بكر الشاطري", bit:128},
];

// ترجمات مختارة (من QUL /resources/translations)
const TRANSLATIONS = [
  {id:131, name:"الدكتور مصطفى خطب — Clear Quran", lang:"en"},
  {id:20,  name:"Saheeh International", lang:"en"},
  {id:149, name:"Fadel Soliman — Bridges’", lang:"en"},
  {id:85,  name:"عبد الله يوسف علي (مختصرة)", lang:"en"},
  {id:95,  name:"تفهم القرآن — المودودي (تفسيري)", lang:"en", tafsirLike:true},
  {id:167, name:"معارف القرآن (تفسيري)", lang:"en", tafsirLike:true},
];

const DEFAULT_TRANSLATION = 131;

/* ============ SiteConfig & Stats — التكامل مع لوحة التحكم ============ */
const LS_CONFIG="quran_config_v1", LS_STATS="quran_stats_v1";
const CONFIG_DEFAULTS={
  siteName:"قارئ القرآن", tagline:"استوديو تصميم الآيات",
  heroTitle:"القرآن الكريم · بنصّ عثماني وتصاميم تنشرها",
  badge:"✦ آية اليوم",
  verseOfDay:null,                    // {surah, ayah} أو null للتدوير اليومي التلقائي
  primaryColor:"", accentColor:"", defaultTheme:"light",
  defaultTranslation:DEFAULT_TRANSLATION, defaultReciter:RECITERS[0].slug,
  defaultVsize:1.7, defaultShowTrans:true,
  studio:{fontFamily:"Amiri Quran", bgIdx:0, fontSize:120, color:"#FAF7F0", watermark:"قارئ القرآن", footer:true},
  updatedAt:0,
};
function lsJSON(key,def){try{const v=JSON.parse(localStorage.getItem(key));return v==null?def:v;}catch(e){return def;}}
const SiteConfig={
  data:null,
  load(){
    const raw=lsJSON(LS_CONFIG,{});
    this.data=Object.assign({},CONFIG_DEFAULTS,raw);
    this.data.studio=Object.assign({},CONFIG_DEFAULTS.studio,raw.studio||{});
    return this.data;
  },
  get(){return this.data||this.load();},
};
const Stats={
  d:null,
  load(){this.d=lsJSON(this.KEY||LS_STATS,{visits:0,reads:0,plays:0,exports:0,searches:0,firstVisit:0,lastVisit:0,daily:{},log:[]});return this.d;},
  save(){try{localStorage.setItem(LS_STATS,JSON.stringify(this.d));}catch(e){}},
  today(){return new Date().toLocaleDateString("sv");},
  bump(kind,detail){
    const d=this.load();
    d[kind]=(d[kind]||0)+1;
    d.lastVisit=Date.now();
    if(!d.firstVisit)d.firstVisit=Date.now();
    const t=this.today();
    d.daily[t]=d.daily[t]||{visits:0,reads:0,plays:0,exports:0,searches:0};
    d.daily[t][kind]=(d.daily[t][kind]||0)+1;
    const days=Object.keys(d.daily).sort();
    while(days.length>30){delete d.daily[days.shift()];}
    d.log.unshift({t:Date.now(),e:kind,d:detail||""});
    d.log=d.log.slice(0,60);
    this.save();
  },
};
function applySiteConfig(){
  const c=SiteConfig.get();
  document.title=(c.siteName||"قارئ القرآن")+" · "+(c.tagline||"");
  const b1=document.querySelector(".brand .txt b"), b2=document.querySelector(".brand .txt small");
  if(b1)b1.textContent=c.siteName;
  if(b2)b2.textContent=c.tagline;
  const r=document.documentElement;
  if(c.primaryColor)r.style.setProperty("--green",c.primaryColor);else r.style.removeProperty("--green");
  if(c.accentColor)r.style.setProperty("--gold",c.accentColor);else r.style.removeProperty("--gold");
}

async function qul(path){
  const res = await fetch(API + path);
  if(!res.ok) throw new Error("QUL "+path+" -> "+res.status);
  return res.json();
}

// فصول + عدد آياتها (مخبأة)
const cache = { chapters:null, verses:{}, allVerses:null };
async function getChapters(){
  if(cache.chapters) return cache.chapters;
  const d = await qul("/chapters?language=ar");
  cache.chapters = d.chapters;
  return d.chapters;
}
// آيات سورة: نص عثماني + ترجمة مدمجة
async function getVerses(surahId, translationId){
  const key = surahId+":"+translationId;
  if(cache.verses[key]) return cache.verses[key];
  const all=[];
  let page=1;
  while(true){
    const d = await qul(`/chapters/${surahId}/verses?fields=text_uthmani,page_number&translations=${translationId}&per_page=300&page=${page}`);
    all.push(...d.verses);
    if(!d.pagination || !d.pagination.next_page) break;
    page++;
    if(page>6) break;
  }
  cache.verses[key]=all;
  return all;
}
// نص آية واحدة (بدون ترجمة) — للاستوديو والبحث
async function getVerseText(surahId, ayah){
  const vs = await getVerses(surahId, DEFAULT_TRANSLATION);
  return vs.find(v=>v.verse_key===surahId+":"+ayah) || vs[ayah-1];
}

/* ============ Utils ============ */
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtTime=s=>{s=Math.max(0,Math.floor(s));const m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0");};
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);
}
function arabicNum(n){return String(n).replace(/[0-9]/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);}
// بناء تعبير نمطي يطابق نصاً عربياً مع تجاهل التشكيل وأشكال الحروف
function buildArRegex(q){
  const diac="[\\u064B-\\u0652\\u0670\\u0640]*";
  const map={
    "\u0627":"[\u0622\u0623\u0625\u0671\u0670\u0627]", // ا → كل أشكال الألف (وألف فوقية ٰ)
    "\u0629":"[\u0629\u0647]",                  // ة → ة/ه
    "\u0649":"[\u0649\u064A]",                  // ى → ى/ي
  };
  const chars=[...q].map(c=>{
    if(map[c])return map[c];
    return c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  }).join(diac);
  try{return new RegExp(chars,"g");}catch(e){return null;}
}

/* ============ State ============ */
const State = {
  theme: localStorage.getItem("qtheme")||null,           // null → من الإعدادات المركزية
  reciter: localStorage.getItem("qreciter")||null,
  vsize: null,
  translation: null,
  showTrans: null,
  lastRead: JSON.parse(localStorage.getItem("qlast")||"null"), // {surah, ayah, name}
};
function stateDefaults(){
  const c=SiteConfig.get();
  if(State.theme==null)State.theme=c.defaultTheme==="dark"?"dark":"light";
  if(State.reciter==null)State.reciter=c.defaultReciter||RECITERS[0].slug;
  if(State.vsize==null)State.vsize=parseFloat(localStorage.getItem("qvsize")||String(c.defaultVsize||1.7));
  if(State.translation==null)State.translation=parseInt(localStorage.getItem("qtrans")||String(c.defaultTranslation||DEFAULT_TRANSLATION));
  if(State.showTrans==null)State.showTrans=localStorage.getItem("qshowtrans")!==null?localStorage.getItem("qshowtrans")!=="0":!!c.defaultShowTrans;
}
function saveTheme(){localStorage.setItem("qtheme",State.theme);}
function applyTheme(){
  document.documentElement.setAttribute("data-theme",State.theme);
  $("#themeBtn").textContent = State.theme==="dark"?"☀️":"🌙";
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = State.theme==="dark"?"#06141a":"#0B3D2E";
}
function toggleTheme(){
  State.theme = State.theme==="dark"?"light":"dark";
  saveTheme();applyTheme();
}

/* ============ Audio Player ============ */
const Player = {
  audio:null, list:[], idx:0, surahName:"", surahId:0,
  init(){
    this.audio=$("#audio");
    this.audio.addEventListener("timeupdate",()=>this.updateBar());
    this.audio.addEventListener("ended",()=>this.next(true));
    this.audio.addEventListener("loadedmetadata",()=>{$("#pDur").textContent=fmtTime(this.audio.duration);});
    this.audio.addEventListener("play",()=>{$("#pPlay").innerHTML="⏸";});
    this.audio.addEventListener("pause",()=>{$("#pPlay").innerHTML="▶";});
    $("#pPlay").addEventListener("click",()=>this.toggle());
    $("#pPrev").addEventListener("click",()=>this.next(false,true));
    $("#pNext").addEventListener("click",()=>this.next(true));
    $("#pBar").addEventListener("click",e=>{
      const r=e.currentTarget.getBoundingClientRect();
      const ratio = State.theme /* dummy */ ; void ratio;
      const pct=(e.clientX-r.left)/r.width;
      // RTL: النقر على اليمين = البداية. اتجاه الشريط من اليمين لليسار بصرياً لكن نعامله LTR داخلياً
      if(getComputedStyle(document.body).direction==="rtl"){
        this.audio.currentTime = (1-pct)*this.audio.duration;
      } else {
        this.audio.currentTime = pct*this.audio.duration;
      }
    });
    const sel=$("#pReciter");
    sel.innerHTML=RECITERS.map(r=>`<option value="${r.slug}">${r.name}</option>`).join("");
    sel.value=State.reciter;
    sel.addEventListener("change",()=>{
      State.reciter=sel.value;localStorage.setItem("qreciter",sel.value);
      if(this.list.length) this.loadCurrent();
    });
  },
  setList(verses, surahId, surahName, startKey){
    this.list=verses;this.surahId=surahId;this.surahName=surahName;
    Stats.bump("plays",String(surahId));
    this.list=verses;this.surahId=surahId;this.surahName=surahName;
    const si = startKey?verses.findIndex(v=>v.verse_key===startKey):0;
    this.idx = si<0?0:si;
    $("#player").classList.add("show");
    this.loadCurrent();
    this.audio.play().catch(()=>{});
  },
  current(){return this.list[this.idx];},
  loadCurrent(){
    const v=this.current();if(!v)return;
    const rec=RECITERS.find(r=>r.slug===State.reciter)||RECITERS[0];
    this.audio.src=`${AUDIO_CDN}/${rec.bit}/${rec.slug}/${v.id}.mp3`;
    this.audio.load();
    $("#pTitle").textContent=`${this.surahName} · ${arabicNum(v.verse_key.split(":")[1])}`;
    $("#pSub").textContent=rec.name;
    document.querySelectorAll(".verse-card.playing").forEach(c=>c.classList.remove("playing"));
    const card=document.querySelector(`.verse-card[data-key="${v.verse_key}"]`);
    if(card){card.classList.add("playing");card.scrollIntoView({block:"center",behavior:"smooth"});}
    // حفظ آخر قراءة
    State.lastRead={surah:this.surahId, ayah:+v.verse_key.split(":")[1], name:this.surahName};
    localStorage.setItem("qlast",JSON.stringify(State.lastRead));
  },
  toggle(){if(this.audio.paused)this.audio.play().catch(()=>{});else this.audio.pause();},
  next(fwd,force){
    if(!this.list.length)return;
    if(fwd){this.idx=Math.min(this.idx+1,this.list.length-1);}
    else{this.idx=Math.max(this.idx-1,0);}
    this.loadCurrent();if(force||fwd)this.audio.play().catch(()=>{});
  },
  updateBar(){
    const a=this.audio;const dur=a.duration||0;
    const pct=dur?(a.currentTime/dur)*100:0;
    $("#pFill").style.width=pct+"%";
    $("#pCur").textContent=fmtTime(a.currentTime);
  },
  playVerse(key){
    const i=this.list.findIndex(v=>v.verse_key===key);
    if(i>=0){this.idx=i;this.loadCurrent();this.audio.play().catch(()=>{});}
  }
};

/* ============ Router ============ */
const Router = {
  routes:[],
  on(re,handler){this.routes.push({re,handler});},
  async run(){
    let h=location.hash.replace(/^#/,"")||"/";
    if(!h.startsWith("/"))h="/"+h;
    const path = h.split("?")[0];        // المسار بدون سلسلة الاستعلام
    $("#nav").classList.remove("open");
    for(const r of this.routes){
      const m=path.match(r.re);
      if(m){await r.handler(m,h);this.setActive(path);window.scrollTo(0,0);return;}
    }
    this.go("#/");
  },
  setActive(path){
    document.querySelectorAll("#nav a").forEach(a=>{
      const route=a.getAttribute("href").replace("#","");
      a.classList.toggle("active", path===route || (route!=="/" && path.startsWith(route)));
    });
  },
  go(hash){location.hash=hash;}
};
window.addEventListener("hashchange",()=>Router.run());

/* ============ Components ============ */
function verseNumSVG(n){
  return `<span class="verse-num"><svg viewBox="0 0 40 40"><path d="M20 2 L34 8 L38 22 L30 36 L10 36 L2 22 L6 8 Z" fill="none" stroke="#C9A227" stroke-width="1.6"/><path d="M20 7 L30 11 L33 22 L27 32 L13 32 L7 22 L10 11 Z" fill="rgba(201,162,39,.10)" stroke="#C9A227" stroke-width="0.8"/><text x="20" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#a8851a" font-family="Cairo">${n}</text></svg></span>`;
}
function surahPlace(p){return p==="makkah"?"مكية":"مدنية";}

function surahCard(c){
  const a=el("a","scard");
  a.href="#/quran/"+c.id;
  a.innerHTML=`
    <span class="num">${arabicNum(c.id)}</span>
    <span class="place">${surahPlace(c.revelation_place)}</span>
    <div class="ar">${esc(c.name_arabic)}</div>
    <div class="en">${esc(c.name_simple)} · ${c.translated_name?esc(c.translated_name.name):""}</div>
    <div class="meta"><span>الآيات <b>${arabicNum(c.verses_count)}</b></span><span>الصفحات <b>${c.pages?arabicNum(c.pages[0]):"-"}</b></span></div>`;
  return a;
}
function surahGrid(chapters, filterText){
  const wrap=el("div","grid-surah");
  const q=(filterText||"").trim();
  chapters.forEach(c=>{
    if(q){
      const hay=(c.name_arabic+" "+c.name_simple+" "+(c.translated_name?c.translated_name.name:"")+" "+c.id).toLowerCase();
      if(!hay.includes(q.toLowerCase()))return;
    }
    wrap.appendChild(surahCard(c));
  });
  return wrap;
}

  {s:65,a:3},{s:39,a:53},{s:40,a:60},{s:55,a:13},{s:24,a:35},{s:3,a:185},

async function renderQuranIndex(){
  const app=$("#app");
  app.innerHTML=`<div class="empty"><div class="ic">◐</div>جارٍ تحميل السور…</div>`;
  const chapters=await getChapters();
  app.innerHTML=`
    <div class="sec-head" style="margin-top:22px"><h2>فهرس السور</h2><span class="ln"></span><span class="more">${arabicNum(chapters.length)} سورة</span></div>
    <div class="filters">
      <div class="field grow"><span class="ic">⌕</span><input id="surahFilter" type="text" placeholder="ابحث باسم السورة أو رقمها…" dir="rtl"></div>
      <div class="chip-row" id="placeFilter">
        <button class="chip active" data-p="all">الكل</button>
        <button class="chip" data-p="makkah">مكية</button>
        <button class="chip" data-p="madinah">مدنية</button>
      </div>
    </div>
    <div id="idxGrid"></div>`;
  let place="all", text="";
  const grid=$("#idxGrid");
  function paint(){
    grid.innerHTML="";
    const filtered=chapters.filter(c=>place==="all"||c.revelation_place===place);
    grid.appendChild(surahGrid(filtered,text));
    if(!grid.children.length) grid.innerHTML=`<div class="empty"><div class="ic">∅</div>لا توجد نتائج</div>`;
  }
  paint();
  $("#surahFilter").addEventListener("input",debounce(e=>{text=e.target.value;paint();},120));
  $("#placeFilter").addEventListener("click",e=>{
    const b=e.target.closest(".chip");if(!b)return;
    $("#placeFilter").querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
    b.classList.add("active");place=b.dataset.p;paint();
  });
}

/* ============ Reader ============ */
async function renderReader(surahId, ayahFocus){
  const app=$("#app");
  app.innerHTML=`<div class="empty"><div class="ic">◐</div>جارٍ تحميل السورة…</div>`;
  const chapters=await getChapters();
  const chap=chapters.find(c=>c.id===surahId);
  if(!chap){app.innerHTML=`<div class="empty">السورة غير موجودة</div>`;return;}
  const verses=await getVerses(surahId, State.translation);
  Stats.bump("reads",String(surahId));
  const cur = chapters.findIndex(c=>c.id===surahId);
  const prev = cur>0?chapters[cur-1]:null;
  const next = cur<chapters.length-1?chapters[cur+1]:null;
  app.innerHTML=`
    <div class="reader-bar">
      <a class="back" href="#/quran">← الفهرس</a>
      ${prev?`<a class="btn btn-ghost btn-sm" href="#/quran/${prev.id}">‹ ${esc(prev.name_arabic)}</a>`:""}
      <span class="sep"></span>
      <span class="title">${esc(chap.name_arabic)}</span>
      <span class="spacer"></span>
      <div class="range-go">
        <input type="number" id="goAyah" min="1" max="${chap.verses_count}" placeholder="آية" dir="ltr">
        <button class="btn btn-ghost btn-sm" id="goBtn">انتقل</button>
      </div>
      ${next?`<a class="btn btn-ghost btn-sm" href="#/quran/${next.id}">${esc(next.name_arabic)} ›</a>`:""}
    </div>
    <section class="surah-head">
      <div class="frame"></div>
      <div class="ename">${esc(chap.name_simple)} · ${chap.translated_name?esc(chap.translated_name.name):""}</div>
      <div class="aname">${esc(chap.name_arabic)}</div>
      <div class="info">
        <span>${surahPlace(chap.revelation_place)}</span>
        <span>الآيات <b>${arabicNum(chap.verses_count)}</b></span>
        <span>ترتيبها <b>${arabicNum(chap.revelation_order)}</b></span>
        <span>الصفحات <b>${chap.pages?arabicNum(chap.pages[0])+"–"+arabicNum(chap.pages[1]):"-"}</b></span>
      </div>
      ${chap.bismillah_pre?`<div class="bism">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>`:""}
    </section>
    <div class="settings-panel">
      <div class="row">
        <label>الترجمة</label>
        <select id="transSel">${TRANSLATIONS.map(t=>`<option value="${t.id}" ${t.id===State.translation?"selected":""}>${esc(t.name)}</option>`).join("")}</select>
        <label style="min-width:auto"><input type="checkbox" id="transTog" ${State.showTrans?"checked":""}> إظهار</label>
      </div>
      <div class="row">
        <label>حجم الخط</label>
        <input type="range" id="sizeRange" min="1.2" max="3" step="0.05" value="${State.vsize}">
        <span class="size-out" id="sizeOut">${State.vsize.toFixed(2)}</span>
      </div>
    </div>
    <div id="verseList"></div>
    <div class="foot" style="margin-top:18px">
      ${prev?`<a href="#/quran/${prev.id}" class="btn btn-ghost">‹ السورة السابقة: ${esc(prev.name_arabic)}</a> · `:""}
      ${next?`<a href="#/quran/${next.id}" class="btn btn-ghost">السورة التالية: ${esc(next.name_arabic)} ›</a>`:""}
    </div>`;
  const list=$("#verseList");
  verses.forEach(v=>{
    const an=+v.verse_key.split(":")[1];
    const tr = v.translations && v.translations[0]? v.translations[0].text : "";
    const trName = v.translations && v.translations[0]? v.translations[0].name : "";
    const card=el("div","verse-card");
    card.dataset.key=v.verse_key;
    card.style.setProperty("--vsize",State.vsize+"rem");
    card.innerHTML=`
      <div class="verse-row">
        ${verseNumSVG(arabicNum(an))}
        <div class="verse-text">${esc(v.text_uthmani)}</div>
      </div>
      ${State.showTrans&&tr?`<div class="verse-trans"><span class="lbl">${esc(trName)}</span><div>${esc(tr)}</div></div>`:""}
      <div class="verse-actions">
        <button class="vbtn" data-act="play">▶ تلاوة</button>
        <button class="vbtn gold" data-act="studio">🖼 صمّم صورة الآية</button>
        <button class="vbtn" data-act="copy">📋 نسخ</button>
        <a class="vbtn" href="#/studio?verse=${v.verse_key}">↗ افتح في الاستوديو</a>
      </div>`;
    card.querySelector('[data-act="play"]').addEventListener("click",()=>{
      if(Player.surahId!==surahId){Player.setList(verses,surahId,chap.name_arabic,v.verse_key);}
      else{Player.playVerse(v.verse_key);}
    });
    card.querySelector('[data-act="studio"]').addEventListener("click",()=>{location.hash="#/studio?verse="+v.verse_key;});
    card.querySelector('[data-act="copy"]').addEventListener("click",async()=>{
      try{await navigator.clipboard.writeText(v.text_uthmani);toast("تم نسخ النص");}
      catch(e){toast("تعذّر النسخ");}
    });
    list.appendChild(card);
  });
  // settings
  $("#transSel").addEventListener("change",e=>{
    State.translation=parseInt(e.target.value);localStorage.setItem("qtrans",State.translation);
    renderReader(surahId,ayahFocus);
  });
  $("#transTog").addEventListener("change",e=>{
    State.showTrans=e.target.checked;localStorage.setItem("qshowtrans",State.showTrans?"1":"0");
    document.querySelectorAll(".verse-trans").forEach(t=>t.style.display=State.showTrans?"":"none");
  });
  $("#sizeRange").addEventListener("input",e=>{
    State.vsize=parseFloat(e.target.value);$("#sizeOut").textContent=State.vsize.toFixed(2);
    document.documentElement.style.setProperty("--vsize",State.vsize+"rem");
    document.querySelectorAll(".verse-text").forEach(t=>t.style.fontSize=State.vsize+"rem");
    localStorage.setItem("qvsize",State.vsize);
  });
  $("#goBtn").addEventListener("click",()=>{
    const n=parseInt($("#goAyah").value);if(!n)return;
    const card=document.querySelector(`.verse-card[data-key="${surahId}:${n}"]`);
    if(card){card.scrollIntoView({block:"center",behavior:"smooth"});card.classList.add("playing");
      setTimeout(()=>card.classList.remove("playing"),1600);}
    else toast("الآية غير موجودة");
  });
  // ربط القارئ بالقائمة الحالية إذا كانت نفس السورة
  if(Player.surahId===surahId){Player.list=verses;}
  // تركيز على آية محددة (deep link)
  if(ayahFocus){
    const card=document.querySelector(`.verse-card[data-key="${surahId}:${ayahFocus}"]`);
    if(card){setTimeout(()=>card.scrollIntoView({block:"center"}),120);}
  }
}

/* ============ Search ============ */
async function renderSearch(prefill){
  const app=$("#app");
  app.innerHTML=`
    <div class="sec-head" style="margin-top:22px"><h2>البحث في الآيات</h2><span class="ln"></span></div>
    <div class="search-box">
      <div class="row">
        <div class="grow"><input id="qInput" type="text" placeholder="اكتب كلمة أو عبارة من الآية…" value="${esc(prefill||"")}" dir="rtl" autofocus></div>
        <button class="btn btn-primary" id="qBtn">ابحث</button>
        <button class="btn btn-ghost" id="qStop" disabled>إيقاف</button>
      </div>
      <div class="prog-line" id="qProg">ابحث في النص العثماني للقرآن كاملاً — يُجلب سورة بسورة.</div>
    </div>
    <div id="qResults" style="margin-top:14px"></div>`;
  const chapters=await getChapters();
  const input=$("#qInput"),btn=$("#qBtn"),stop=$("#qStop"),prog=$("#qProg"),res=$("#qResults");
  let aborted=false;
  async function run(){
    const q=input.value.trim();if(q.length<2){toast("اكتب حرفين على الأقل");return;}
    const regex=buildArRegex(q);
    Stats.bump("searches",q.slice(0,20));
    aborted=false;btn.disabled=true;stop.disabled=false;res.innerHTML="";let found=0;const CAP=80;
    for(let i=0;i<chapters.length;i++){
      if(aborted)break;
      const c=chapters[i];
      prog.innerHTML=`<span class="spinner"></span> يبحث في: ${esc(c.name_arabic)} (${arabicNum(i+1)}/${arabicNum(chapters.length)}) · نتائج حتى الآن: ${arabicNum(found)}`;
      try{
        const vs=await getVerses(c.id, DEFAULT_TRANSLATION);
        for(const v of vs){
          if(!v.text_uthmani || !regex)continue;
          const matches=v.text_uthmani.match(regex);
          if(!matches)continue;
          found+=matches.length;
          const an=+v.verse_key.split(":")[1];
          const hi=v.text_uthmani.replace(regex,mm=>`<mark style="background:rgba(201,162,39,.35);color:inherit;border-radius:3px">${esc(mm)}</mark>`);
          const item=el("div","res-item");
          item.innerHTML=`<div class="vt">${hi}</div><div class="vr">${esc(c.name_arabic)} · الآية ${arabicNum(an)} · ${v.verse_key}</div>`;
          item.addEventListener("click",()=>{location.hash="#/quran/"+c.id;});
          res.appendChild(item);
          if(found>=CAP){prog.innerHTML=`تم الوصول إلى الحد الأقصى (${arabicNum(CAP)} نتيجة). انظر النتائج أدناه.`;return;}
        }
      }catch(e){}
      await new Promise(r=>setTimeout(r,0));
    }
    prog.innerHTML=aborted?`تم الإيقاف. عدد النتائج: ${arabicNum(found)}`:`اكتمل البحث. عدد النتائج: ${arabicNum(found)}`;
    if(!found)res.innerHTML=`<div class="empty"><div class="ic">∅</div>لا توجد نتائج لـ «${esc(q)}»</div>`;
  }
  btn.addEventListener("click",run);
  stop.addEventListener("click",()=>{aborted=true;stop.disabled=true;btn.disabled=false;});
  input.addEventListener("keydown",e=>{if(e.key==="Enter")run();});
  if(prefill&&prefill.length>=2)run();
}

  {n:"إستوري",d:"عمودي 9:16",pv:"linear-gradient(160deg,#050a14,#1a2a4a)",apply:S=>{S.bgType="gradient";S.bgIdx=23;S.overlay=.3;S.fontFamily="Amiri Quran";S.color="#FAF7F0";S.fontSize=110;S.shadow=true;S.glow=false;S.goldFrame=true;S.corners=true;S.footer=true;S.w=1080;S.h=1920;}},
  {n:"اقتباس عاجي",d:"فاتح أنيق",pv:"linear-gradient(135deg,#F3EFE3,#E6D9B8)",apply:S=>{S.bgType="gradient";S.bgIdx=14;S.overlay=.05;S.fontFamily="Reem Kufi";S.color="#0B3D2E";S.fontSize=100;S.shadow=false;S.glow=false;S.goldFrame=false;S.corners=false;S.footer=true;S.w=1080;S.h=1080;}},
  {n:"فجر دافئ",d:"غروب",pv:"linear-gradient(135deg,#3d1f2e,#d98a5a)",apply:S=>{S.bgType="gradient";S.bgIdx=6;S.overlay=.2;S.fontFamily="Amiri Quran";S.color="#FAF7F0";S.fontSize=120;S.shadow=true;S.glow=false;S.goldFrame=false;S.corners=false;S.footer=true;S.w=1080;S.h=1080;}},
  {n:"ذهبي ملكي",d:"خلفية ذهب",pv:"linear-gradient(135deg,#7a5d12,#E6C75A)",apply:S=>{S.bgType="gradient";S.bgIdx=5;S.overlay=.1;S.fontFamily="Amiri Quran";S.color="#231a05";S.fontSize=120;S.shadow=false;S.glow=false;S.goldFrame=true;S.corners=true;S.footer=true;S.w=1080;S.h=1080;}},
];
const DIMS=[
  {n:"مربع",w:1080,h:1080},{n:"إستوري",w:1080,h:1920},{n:"بنر",w:1200,h:630},{n:"مربع ص",w:800,h:800},
];

const Studio={
  S:(function(){
    const cfg=SiteConfig.get();
    const st=cfg.studio||{};
    return {
      surah:2,ayah:255,verseText:"",verseKey:"2:255",chapterName:"البقرة",
      textSrc:"uthmani",transText:"",
      bgType:"gradient",bgIdx:st.bgIdx||0,bgColor:"#0B3D2E",bgImg:null,
      overlay:.25,
      fontFamily:st.fontFamily||"Amiri Quran",fontSize:st.fontSize||120,color:st.color||"#FAF7F0",align:"center",
      shadow:true,glow:false,goldFrame:true,corners:false,footer:st.footer!==false,watermark:st.watermark||cfg.siteName||"قارئ القرآن",
      w:1080,h:1080,
    };
  })(),
  chapters:null,
  async init(verseKey){
    if(!this.chapters) this.chapters=await getChapters();
    if(verseKey){
      const [s,a]=verseKey.split(":").map(Number);
      if(s){this.S.surah=s;if(a)this.S.ayah=a;}
    }
    await this.loadVerse();
    this.buildUI();
    this.bind();
    await this.render();
  },
  async loadVerse(){
    try{
      const vs=await getVerses(this.S.surah, DEFAULT_TRANSLATION);
      const v=vs.find(x=>x.verse_key===this.S.surah+":"+this.S.ayah)||vs[this.S.ayah-1];
      if(v){
        this.S.verseText=v.text_uthmani;
        this.S.verseKey=v.verse_key;
        this.S.transText=(v.translations&&v.translations[0])?v.translations[0].text.replace(/<[^>]+>/g,""):"";
      }
      const c=this.chapters.find(x=>x.id===this.S.surah);
      this.S.chapterName=c?c.name_arabic:"";
    }catch(e){toast("تعذّر تحميل الآية");}
  },
  buildUI(){
    const app=$("#app");
    const c=this.chapters, s=this.S;
    app.innerHTML=`
      <div class="sec-head" style="margin-top:22px"><h2>استوديو تصميم الآيات</h2><span class="ln"></span><span class="more">صمّم · صدّر · شارك</span></div>
      <div class="studio">
        <!-- يسار: اختيار الآية -->
        <div class="col">
          <div class="col-h">✦ اختيار الآية</div>
          <div class="col-b">
            <div class="form-g"><label>السورة</label>
              <select id="stSurah">${c.map(ch=>`<option value="${ch.id}" ${ch.id===s.surah?"selected":""}>${arabicNum(ch.id)}. ${esc(ch.name_arabic)}</option>`).join("")}</select>
            </div>
            <div class="form-g"><label>الآية</label>
              <div class="two"><input id="stAyah" type="number" min="1" value="${s.ayah}" dir="ltr"><button class="btn btn-ghost btn-sm" id="stAyahGo">تحميل</button></div>
            </div>
            <div class="form-g"><label>مصدر النص</label>
              <select id="stSrc">
                <option value="uthmani" ${s.textSrc==="uthmani"?"selected":""}>النص العثماني</option>
                <option value="translation" ${s.textSrc==="translation"?"selected":""}>الترجمة (${esc(TRANSLATIONS.find(t=>t.id===DEFAULT_TRANSLATION).name)})</option>
              </select>
            </div>
            <div class="form-g">
              <label>معاينة النص</label>
              <div style="font-family:var(--quran-font);font-size:1.1rem;line-height:2;color:var(--green-deep);background:var(--paper-2);padding:10px;border-radius:9px;max-height:120px;overflow:auto" id="stPreview">${esc(s.textSrc==="translation"?s.transText:s.verseText)}</div>
            </div>
            <div class="form-g"><a class="upbtn" href="#/quran/${s.surah}" style="text-decoration:none">↗ افتح السورة في القارئ</a></div>
          </div>
        </div>
        <!-- وسط: المعاينة + الأبعاد + التصدير -->

          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
            ${DIMS.map((d,i)=>`<button class="chip ${d.w===s.w&&d.h===s.h?"active":""}" data-dim="${i}">${d.n} ${d.w}×${d.h}</button>`).join("")}
            <button class="chip" id="dimCustom">مخصص</button>
          </div>
          <div class="two" id="dimCustomRow" style="display:none;gap:8px;width:100%;max-width:300px">
            <input type="number" id="dimW" value="${s.w}" placeholder="عرض" dir="ltr" style="height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper-2);text-align:center">
            <input type="number" id="dimH" value="${s.h}" placeholder="ارتفاع" dir="ltr" style="height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper-2);text-align:center">
          </div>
          <div class="studio-export">
            <button class="btn btn-gold" id="exPng">⬇ PNG</button>

            <button class="btn btn-ghost" id="exShare">↗ مشاركة</button>
          </div>
        </div>
        <!-- يمين: الأدوات بتبويبات -->
        <div class="col">

              </div>

              <div id="bgSolid" class="swatches" style="display:none"></div>
              <div id="bgImage" style="display:none">

                <input type="file" id="bgFile" accept="image/*" style="display:none">
                ${s.bgImg?`<div style="margin-top:8px;font-size:.78rem;color:var(--muted)">صورة محمّلة ✓ <button class="btn btn-ghost btn-sm" id="bgClear">إزالة</button></div>`:""}
              </div>
              <div class="form-g" style="margin-top:12px"><label>تعتيم الخلفية (Overlay)</label>
                <div class="range-row"><input type="range" id="bgOverlay" min="0" max="0.8" step="0.05" value="${s.overlay}"><span class="v" id="ovOut">${Math.round(s.overlay*100)}%</span></div>
              </div>
            </div>
            <div class="stab" data-tab="1" style="display:none;padding:14px 16px">
              <div class="form-g"><label>عائلة الخط</label>
                <select id="stFont">${FONT_OPTS.map(f=>`<option value="${f.v}" ${f.v===s.fontFamily?"selected":""}>${f.n}</option>`).join("")}</select>
              </div>
              <div class="form-g"><label>الحجم <span id="fsOut" style="color:var(--green)">${s.fontSize}</span>px</label>
                <div class="range-row"><input type="range" id="stFontSz" min="40" max="220" step="2" value="${s.fontSize}"></div>
              </div>
              <div class="form-g"><label>لون النص</label>
                <div class="swatches" id="stColors">${TEXT_COLORS.map(c=>`<div class="sw ${c===s.color?"active":""}" data-c="${c}" style="background:${c}"></div>`).join("")}</div>
              </div>
              <div class="form-g"><label>المحاذاة</label>
                <div class="chip-row" id="stAlign">
                  <button class="chip ${s.align==="center"?"active":""}" data-a="center">وسط</button>
                  <button class="chip ${s.align==="right"?"active":""}" data-a="right">يمين</button>
                  <button class="chip ${s.align==="left"?"active":""}" data-a="left">يسار</button>
                </div>
              </div>
            </div>
            <div class="stab" data-tab="2" style="display:none;padding:14px 16px">
              <div class="toggle">ظل النص <span class="switch ${s.shadow?"on":""}" data-f="shadow"></span></div>
              <div class="toggle">توهج (Glow) <span class="switch ${s.glow?"on":""}" data-f="glow"></span></div>
              <div class="toggle">إطار ذهبي <span class="switch ${s.goldFrame?"on":""}" data-f="goldFrame"></span></div>
              <div class="toggle">زخارف الزوايا <span class="switch ${s.corners?"on":""}" data-f="corners"></span></div>
              <div class="toggle">اسم السورة ورقم الآية <span class="switch ${s.footer?"on":""}" data-f="footer"></span></div>
              <div class="form-g" style="margin-top:10px"><label>علامة مائية (أسفل)</label><input type="text" id="stWm" value="${esc(s.watermark)}" dir="rtl"></div>
            </div>
            <div class="stab" data-tab="3" style="display:none;padding:14px 16px">
              <div class="tmpl" id="stTmpl">${TEMPLATES.map((t,i)=>`<div class="tcard" data-tmpl="${i}"><div class="pv" style="background:${t.pv}">آية</div><b>${t.n}</b><small>${t.d}</small></div>`).join("")}</div>
            </div>
          </div>
        </div>
      </div>
      <p style="color:var(--muted);font-size:.78rem;margin-top:14px;text-align:center">يُرسم النص مباشرة على Canvas بخطوط قرآنية — لا تُرفع آياتك لأي خادم. التصدير بدقة عالية (${s.w}×${s.h}).</p>`;
    // بناء شبكات الخلفية
    $("#bgGradient").innerHTML=GRADIENTS.map((g,i)=>`<div class="gd ${i===s.bgIdx&&s.bgType==="gradient"?"active":""}" data-g="${i}" title="${esc(g.n)}" style="background:linear-gradient(${g.a}deg,${g.c.map(x=>x[1]).join(",")})"></div>`).join("");
    $("#bgSolid").innerHTML=SOLIDS.map(c=>`<div class="sw ${c===s.bgColor&&s.bgType==="solid"?"active":""}" data-sc="${c}" style="background:${c}"></div>`).join("");
  },
  bind(){
    const s=this.S, self=this;
    // tabs (delegation على عمود الأدوات)
    const toolsCol=document.querySelector(".studio .col:last-child .col-b");
    if(toolsCol) toolsCol.addEventListener("click",e=>{
      const t=e.target.closest(".sttab");if(!t)return;
      document.querySelectorAll(".sttab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
      document.querySelectorAll(".stab").forEach(p=>p.style.display=p.dataset.tab===t.dataset.tab?"":"none");
    });
    // surah/ayah
    $("#stSurah").addEventListener("change",async e=>{s.surah=+e.target.value;s.ayah=1;await self.loadVerse();$("#stAyah").value=1;self.updatePreview();await self.render();});
    $("#stAyahGo").addEventListener("click",async()=>{const n=parseInt($("#stAyah").value);if(n>=1){s.ayah=n;await self.loadVerse();self.updatePreview();await self.render();}});
    $("#stSrc").addEventListener("change",e=>{s.textSrc=e.target.value;self.updatePreview();self.render();});
    // dims
    document.querySelectorAll('[data-dim]').forEach(b=>b.addEventListener("click",()=>{const d=DIMS[+b.dataset.dim];s.w=d.w;s.h=d.h;$("#dimCustomRow").style.display="none";document.querySelectorAll('[data-dim]').forEach(x=>x.classList.remove("active"));b.classList.add("active");$("#stNote").textContent=d.w+"×"+d.h;self.render();}));
    $("#dimCustom").addEventListener("click",()=>{$("#dimCustomRow").style.display="flex";document.querySelectorAll('[data-dim]').forEach(x=>x.classList.remove("active"));$("#dimCustom").classList.add("active");});
    $("#dimW").addEventListener("change",e=>{s.w=Math.max(200,+e.target.value||1080);$("#stNote").textContent=s.w+"×"+s.h;self.render();});
    $("#dimH").addEventListener("change",e=>{s.h=Math.max(200,+e.target.value||1080);$("#stNote").textContent=s.w+"×"+s.h;self.render();});
    // bg type
    $("#bgType").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;s.bgType=b.dataset.t;document.querySelectorAll('#bgType .chip').forEach(x=>x.classList.remove("active"));b.classList.add("active");$("#bgGradient").style.display=s.bgType==="gradient"?"":"none";$("#bgSolid").style.display=s.bgType==="solid"?"":"none";$("#bgImage").style.display=s.bgType==="image"?"":"none";self.render();});
    $("#bgGradient").addEventListener("click",e=>{const g=e.target.closest("[data-g]");if(!g)return;s.bgIdx=+g.dataset.g;document.querySelectorAll("#bgGradient .gd").forEach(x=>x.classList.remove("active"));g.classList.add("active");self.render();});
    $("#bgSolid").addEventListener("click",e=>{const g=e.target.closest("[data-sc]");if(!g)return;s.bgColor=g.dataset.sc;document.querySelectorAll("#bgSolid .sw").forEach(x=>x.classList.remove("active"));g.classList.add("active");self.render();});
    $("#bgOverlay").addEventListener("input",e=>{s.overlay=+e.target.value;$("#ovOut").textContent=Math.round(s.overlay*100)+"%";self.render();});
    // upload
    $("#bgUpload").addEventListener("click",()=>$("#bgFile").click());
    $("#bgFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{s.bgImg=r.result;self.render();toast("تم تحميل الصورة");};r.readAsDataURL(f);});
    const bgClr=$("#bgClear");if(bgClr)bgClr.addEventListener("click",()=>{s.bgImg=null;self.render();});
    // text
    $("#stFont").addEventListener("change",e=>{s.fontFamily=e.target.value;self.render();});
    $("#stFontSz").addEventListener("input",e=>{s.fontSize=+e.target.value;$("#fsOut").textContent=s.fontSize;self.render();});
    $("#stColors").addEventListener("click",e=>{const c=e.target.closest("[data-c]");if(!c)return;s.color=c.dataset.c;document.querySelectorAll("#stColors .sw").forEach(x=>x.classList.remove("active"));c.classList.add("active");self.render();});
    $("#stAlign").addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;s.align=b.dataset.a;document.querySelectorAll("#stAlign .chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");self.render();});
    // effects toggles
    document.querySelectorAll('.switch[data-f]').forEach(sw=>sw.addEventListener("click",()=>{const f=sw.dataset.f;s[f]=!s[f];sw.classList.toggle("on",s[f]);self.render();}));
    $("#stWm").addEventListener("input",e=>{s.watermark=e.target.value;self.render();});
    // templates
    $("#stTmpl").addEventListener("click",e=>{const t=e.target.closest("[data-tmpl]");if(!t)return;TEMPLATES[+t.dataset.tmpl].apply(s);self.buildUI();self.bind();self.render();toast("تم تطبيق القالب");});
    // export
    $("#exPng").addEventListener("click",()=>self.download("png"));
    $("#exJpg").addEventListener("click",()=>self.download("jpeg"));
    $("#exCopy").addEventListener("click",()=>self.copy());
    $("#exShare").addEventListener("click",()=>self.share());
  },
  updatePreview(){
    $("#stPreview").textContent=this.S.textSrc==="translation"?this.S.transText:this.S.verseText;
  },
  async render(){
    const s=this.S;
    const cv=$("#stCanvas");if(!cv)return;
    // ضمان تحميل الخط
    try{await document.fonts.load(`${s.fontSize}px "${s.fontFamily}"`);await document.fonts.ready;}catch(e){}
    cv.width=s.w;cv.height=s.h;
    const ctx=cv.getContext("2d");
    ctx.clearRect(0,0,s.w,s.h);
    // 1) الخلفية
    if(s.bgType==="solid"){
      ctx.fillStyle=s.bgColor;ctx.fillRect(0,0,s.w,s.h);
    } else if(s.bgType==="image"&&s.bgImg){
      try{const img=await this.loadImg(s.bgImg);this.drawCover(ctx,img,s.w,s.h);}catch(e){ctx.fillStyle="#0B3D2E";ctx.fillRect(0,0,s.w,s.h);}
    } else {
      const g=GRADIENTS[s.bgIdx]||GRADIENTS[0];
      ctx.fillStyle=this.makeGrad(ctx,g,s.w,s.h);ctx.fillRect(0,0,s.w,s.h);
    }
    // 2) تعتيم
    if(s.overlay>0){ctx.fillStyle=`rgba(0,0,0,${s.overlay})`;ctx.fillRect(0,0,s.w,s.h);}
    // 3) الإطار الذهبي
    if(s.goldFrame){
      const m=Math.round(s.w*0.025);
      ctx.strokeStyle="#C9A227";ctx.lineWidth=Math.max(2,s.w*0.004);
      ctx.strokeRect(m,m,s.w-2*m,s.h-2*m);
      ctx.strokeStyle="rgba(201,162,39,.5)";ctx.lineWidth=1;
      ctx.strokeRect(m+6,m+6,s.w-2*m-12,s.h-2*m-12);
    }
    // 4) زخارف الزوايا
    if(s.corners){this.drawCorners(ctx,s.w,s.h);}
    // 5) النص
    const text=s.textSrc==="translation"?s.transText:s.verseText;
    if(text)this.drawText(ctx,text,s);
    // 6) التذييل
    if(s.footer)this.drawFooter(ctx,s);
    // 7) العلامة المائية
    if(s.watermark)this.drawWatermark(ctx,s);
  },
  loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.crossOrigin="anonymous";i.src=src;});},
  drawCover(ctx,img,w,h){
    const r=Math.max(w/img.width,h/img.height);const nw=img.width*r,nh=img.height*r;
    ctx.drawImage(img,(w-nw)/2,(h-nh)/2,nw,nh);
  },
  makeGrad(ctx,g,w,h){
    const rad=g.a*Math.PI/180;const x=Math.cos(rad),y=Math.sin(rad);
    const len=Math.abs(w*x)+Math.abs(h*y);const cx=w/2,cy=h/2;
    const grd=ctx.createLinearGradient(cx-x*len/2,cy-y*len/2,cx+x*len/2,cy+y*len/2);
    g.c.forEach(st=>grd.addColorStop(parseFloat(st[0])/100,st[1]));
    return grd;
  },
  drawCorners(ctx,w,h){
    const sz=Math.round(w*0.06);const m=Math.round(w*0.035);
    ctx.strokeStyle="#C9A227";ctx.lineWidth=Math.max(2,w*0.003);
    const spots=[[m,m],[w-m-sz,m],[m,h-m-sz],[w-m-sz,h-m-sz]];
    spots.forEach(([x,y])=>{
      ctx.beginPath();
      // نجمة ثمانية مصغّرة
      ctx.save();ctx.translate(x+sz/2,y+sz/2);ctx.rotate(Math.PI/8);
      const r=sz/2;
      ctx.beginPath();
      for(let k=0;k<8;k++){const a=k*Math.PI/4;const rr=k%2?r*0.6:r;const px=Math.cos(a)*rr,py=Math.sin(a)*rr;k===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
      ctx.closePath();ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,r*0.25,0,Math.PI*2);ctx.fillStyle="rgba(201,162,39,.25)";ctx.fill();
      ctx.restore();
    });
  },
  drawText(ctx,text,s){
    const maxW=s.w*0.82;const fs=s.fontSize;
    ctx.font=`${fs}px "${s.fontFamily}", serif`;
    ctx.fillStyle=s.color;
    ctx.direction="rtl";
    // ظل/توهج
    if(s.glow){ctx.shadowColor=s.color;ctx.shadowBlur=fs*0.4;}
    else if(s.shadow){ctx.shadowColor="rgba(0,0,0,.55)";ctx.shadowBlur=fs*0.18;ctx.shadowOffsetY=fs*0.04;}
    else{ctx.shadowColor="transparent";ctx.shadowBlur=0;}
    // تقسيم الأسطر
    const words=text.split(/\s+/);
    const lines=[];let line="";
    for(const wd of words){
      const t=line?line+" "+wd:wd;
      if(ctx.measureText(t).width>maxW && line){lines.push(line);line=wd;}
      else line=t;
    }
    if(line)lines.push(line);
    const lh=fs*1.6;
    const totalH=lines.length*lh;
    let y=(s.h-totalH)/2+lh/2;
    const x = s.align==="center"?s.w/2 : s.align==="right"?s.w*0.91 : s.w*0.09;
    ctx.textAlign=s.align;
    ctx.textBaseline="middle";
    lines.forEach(ln=>{ctx.fillText(ln,x,y);y+=lh;});
    ctx.shadowColor="transparent";ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  },
  drawFooter(ctx,s){
    const an=+s.verseKey.split(":")[1];
    const label=`﴿ ${s.chapterName} · ${arabicNum(an)} ﴾`;
    const fs=Math.round(s.fontSize*0.22);
    ctx.font=`${fs}px "Reem Kufi","Cairo",sans-serif`;
    ctx.fillStyle="#E6C75A";
    ctx.textAlign="center";ctx.textBaseline="alphabetic";
    ctx.shadowColor="rgba(0,0,0,.4)";ctx.shadowBlur=fs*0.3;
    ctx.fillText(label,s.w/2,s.h-Math.round(s.h*0.05));
    // فاصل ذهبي رفيع
    const lw=ctx.measureText?Math.min(s.w*0.3,200):200;
    ctx.shadowBlur=0;
    ctx.strokeStyle="rgba(201,162,39,.6)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(s.w/2-lw/2,s.h-Math.round(s.h*0.07));ctx.lineTo(s.w/2+lw/2,s.h-Math.round(s.h*0.07));ctx.stroke();
  },
  drawWatermark(ctx,s){
    const fs=Math.round(s.fontSize*0.14);
    ctx.font=`${fs}px "Cairo",sans-serif`;
    ctx.fillStyle="rgba(250,247,240,.55)";
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
    ctx.direction="ltr";
    ctx.fillText(s.watermark,Math.round(s.w*0.04),s.h-Math.round(s.h*0.025));
    ctx.direction="rtl";
  },
  dataURL(type){const cv=$("#stCanvas");return cv.toDataURL(type==="jpeg"?"image/jpeg":"image/png",0.92);},
  download(type){
    const url=this.dataURL(type);const ext=type==="jpeg"?"jpg":"png";
    const a=document.createElement("a");
    a.href=url;a.download=`ayah_${this.S.verseKey.replace(":","_")}.${ext}`;
    document.body.appendChild(a);a.click();a.remove();
    Stats.bump("exports",this.S.verseKey);
    toast("تم تنزيل الصورة");
  },
  async copy(){
    try{
      const cv=$("#stCanvas");const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
      if(navigator.clipboard&&window.ClipboardItem){
        await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
        toast("تم نسخ الصورة للحافظة");
      } else {toast("النسخ غير مدعوم في هذا المتصفح");}
    }catch(e){toast("تعذّر النسخ: "+e.message);}
  },
  async share(){
    try{
      const cv=$("#stCanvas");const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
      const file=new File([blob],`ayah_${this.S.verseKey.replace(":","_")}.png`,{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:"آية من القرآن الكريم",text:this.S.verseText});
      } else if(navigator.share){
        await navigator.share({title:"آية من القرآن الكريم",text:this.S.verseText});
      } else {toast("المشاركة غير مدعومة — استخدم التنزيل");}
    }catch(e){if(e.name!=="AbortError")toast("تعذّرت المشاركة");}
  }
};

/* ============ Routes registration ============ */
Router.on(/^\/quran\/(\d+)\/(\d+)$/,m=>renderReader(+m[1],+m[2]));
Router.on(/^\/quran\/(\d+)$/,m=>renderReader(+m[1]));
Router.on(/^\/quran$/,()=>renderQuranIndex());
Router.on(/^\/studio$/,async(m,h)=>{const q=h.split("?")[1]||"";const p=new URLSearchParams(q);await Studio.init(p.get("verse"));});
Router.on(/^\/search$/,async(m,h)=>{const q=h.split("?")[1]||"";const p=new URLSearchParams(q);await renderSearch(p.get("q")||"");});
Router.on(/^\/recitations$/,()=>renderRecitations());
Router.on(/^\/$/,()=>renderHome());

/* ============ Boot ============ */
(function init(){
  SiteConfig.load();      // الإعدادات المركزية (تُدار من لوحة التحكم)
  stateDefaults();        // الافتراضيات منها
  applySiteConfig();
  applyTheme();
  $("#themeBtn").addEventListener("click",toggleTheme);
  $("#menuBtn").addEventListener("click",()=>$("#nav").classList.toggle("open"));
  $("#topSearch").addEventListener("keydown",e=>{
    if(e.key==="Enter"&&e.target.value.trim()){location.hash="#/search?q="+encodeURIComponent(e.target.value.trim());}
  });
  Player.init();
  // استقبال تحديثات الإعدادات المباشرة من لوحة التحكم (عند فتحهما معاً في نفس المتصفح)
  window.addEventListener("storage",e=>{
    if(e.key===LS_CONFIG){SiteConfig.load();stateDefaults();applySiteConfig();applyTheme();}
  });
  // preload chapters
  getChapters().catch(()=>{});
  if(!location.hash) Router.go("#/");
  else Router.run();
})();

</script>
