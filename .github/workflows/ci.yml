# Continuous integration: one line of defense against regressions.
# Runs on every push/PR to main: lint → unit tests → build → dependency audit.
# The reciter health job runs weekly to catch broken upstream CDN folders early.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, Mondays 06:00 UTC — reciter health drift check

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: File size ceiling (≤ 600 lines per source file)
        run: npx --yes tsx scripts/check-file-size.ts

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (node:test via tsx)
        run: npx --yes tsx --test lib/*.test.ts

      - name: Production build
        run: npm run build
        env:
          DISABLE_HMR: 'true'

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

  reciter-health:
    # Only the scheduled run probes all 38 upstream CDNs; PRs skip network flakiness.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe all reciter upstreams (HEAD per reciter)
        run: npx --yes tsx scripts/check-reciters.ts
