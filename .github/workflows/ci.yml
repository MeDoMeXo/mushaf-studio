# Continuous integration: one line of defense against regressions.
# Runs on every push/PR to main: lint → unit tests → build → dependency audit.
# The project is Bun-based (bun.lock): setup-bun drives install/test/scripts,
# and actions/cache persists Bun's global install cache between runs.
# The reciter health job runs weekly to catch broken upstream CDN folders early.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, Mondays 06:00 UTC — reciter health drift check
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Bun drives every command below (install, test, scripts). Pin the
      # version the lockfile was generated with for reproducible installs.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Node runtime for `next build` (its bin entry runs under node).
      # NOTE: no `cache:` input here — npm lockfile caching is what broke CI
      # before (this repo has no package-lock.json); the actions/cache step
      # below handles dependency caching for Bun instead.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Bun's global install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: File size ceiling (≤ 600 lines per source file)
        run: bun run scripts/check-file-size.ts

      - name: Lint (eslint)
        run: bun run lint

      # Audio slicing tests (mp3quran-timing) exec ffmpeg via resolveFfmpegPath();
      # runner images no longer bundle ffmpeg, so install it explicitly.
      - name: Install ffmpeg (audio slicing tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Unit tests (bun test)
        run: bun test

      - name: Production build
        run: bun run build
        env:
          DISABLE_HMR: 'true'

      - name: Dependency audit (high+)
        run: bun audit --audit-level=high

  reciter-health:
    # Only the scheduled run probes all 38 upstream CDNs; PRs skip network flakiness.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun's global install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Probe all reciter upstreams (HEAD per reciter)
        run: bun run scripts/check-reciters.ts
